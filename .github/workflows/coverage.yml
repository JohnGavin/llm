# Code coverage for the llm package.
#
# llm#905 recommendation #2: "Coverage in CI -- the largest genuine gap, and
# it needs no new dependency beyond covr. Do this first regardless of the
# rest." No coverage step existed anywhere in this repo's CI before this
# workflow.
#
# Deliberately Native R, NOT the project's Nix shell: covr::package_coverage()
# fails under Nix with "error reading from connection" (see the
# ci-workflows-github-actions skill's "Code Coverage (Non-Nix)" template,
# .claude/skills/ci-workflows-github-actions/references/workflow-templates.md).
# r-lib/actions/setup-r-dependencies reads DESCRIPTION and installs Imports +
# Suggests from CRAN on ubuntu-latest, independent of default.nix.
#
# No third-party coverage service (codecov.io etc.) is wired up here -- no new
# secret/token is required. Coverage is written to inst/extdata/coverage.rds
# and committed back to the repo, matching the existing pattern used for other
# generated telemetry data in this project (readable via readRDS() from a
# vignette/dashboard later, same as the documented template's intent).

name: Code Coverage

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: covr

      - name: Generate coverage
        run: |
          Rscript -e '
            cov <- covr::package_coverage()
            print(cov)
            saveRDS(cov, "inst/extdata/coverage.rds")
          '

      - name: Commit coverage data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inst/extdata/coverage.rds
          git diff --staged --quiet || git commit -m "chore(coverage): update coverage data [skip ci]"
          git push
